name: Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-benchmark:
    strategy:
      fail-fast: false
      matrix:
        config:
          # Linux: GCC
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          # Linux: Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          # macOS: AppleClang
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          # Windows: MSVC
          - os: windows-latest
            compiler: msvc
        # The benchmark sink modes, see benchmarks/sink.hpp, each in a job of its own.
        sink: [ sum, barrier, write ]

    runs-on: ${{ matrix.config.os }}

    env:
      BUILD_TYPE: Release
      # Directory inside the repo where the binary will write CSVs / plots
      OUTPUT_DIR: artifacts/${{ matrix.config.os }}-${{ matrix.config.compiler }}-${{ matrix.sink }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The environment of the plot scripts, activated only in the step that plots: a login shell
      # in the build steps could reorder PATH and shadow the MSVC tools on Windows.
      - name: Set up the plot environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: plot/conda-env.yaml
          init-shell: bash
          cache-environment: true

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      # MSVC isn't picked via CC/CXX env vars the way GCC/Clang are, and needs the Visual
      # Studio developer environment (vcvarsall) set up first, so it gets its own setup step
      # instead of using the system-installed compiler the other rows rely on.
      - name: Setup C++ (Windows MSVC)
        if: matrix.config.compiler == 'msvc'
        uses: aminya/setup-cpp@v1
        with:
          compiler: msvc
          cmake: true
          ninja: true
          vcvarsall: true

      - name: Configure CMake
        run: |
          if [[ "${{ matrix.config.compiler }}" != "msvc" ]]; then
            export CC="${{ matrix.config.cc }}"
            export CXX="${{ matrix.config.cxx }}"
          fi
          SINK_MODE="FISK_BENCHMARK_SINK_$(echo "${{ matrix.sink }}" | tr 'a-z' 'A-Z')"
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -DFISK_BUILD_TESTS=OFF \
            -DFISK_BENCHMARK_SINK_MODE="${SINK_MODE}"

      - name: Build
        id: build
        run: |
          cmake --build build --config "${BUILD_TYPE}" -- -j 4 -k 0 2>&1 | tee build.log

      # GitHub shows at most 10 error annotations per step, so all distinct error lines of the
      # build also go to the job summary.
      - name: Summarize build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E 'error( [A-Z]+[0-9]+)?:' build.log | awk '!seen[$0]++' || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run benchmarks
        run: |
          mkdir -p "${OUTPUT_DIR}"
          ./bin/fisk_benchmarks --output-dir "${OUTPUT_DIR}" &> ${OUTPUT_DIR}/log.txt

      - name: Run plotting script
        shell: bash -leo pipefail {0}
        run: |
          ./plot/plot_run.sh "${OUTPUT_DIR}"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.config.os }}-${{ matrix.config.compiler }}-${{ matrix.sink }}
          path: ${{ env.OUTPUT_DIR }}

  # A short run of scripts/run_benchmarks.sh, which build-benchmark does not cover: the script
  # itself, the genome sweep, and the example via example/run_human_genome.sh. The small FASTA of
  # the example stands in for the human genome, and the suites run with short samples, so the
  # timings are meaningless; only the run and its output files are checked. One compiler per OS
  # suffices, as the script does the same for each: Apple Clang on macOS (the script's default),
  # Clang on Linux.
  run-script:
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-latest
            compilers: ""
          - os: ubuntu-latest
            compilers: clang

    runs-on: ${{ matrix.config.os }}

    env:
      OUTPUT_DIR: artifacts/run-script-${{ matrix.config.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run the benchmark script
        run: |
          compiler_args=()
          if [ -n "${{ matrix.config.compilers }}" ]; then
            compiler_args=( --compilers "${{ matrix.config.compilers }}" )
          fi
          scripts/run_benchmarks.sh --modes sum --genome-file example/test.fa \
            --results-dir "${OUTPUT_DIR}" "${compiler_args[@]}" \
            -- --sample-ms 1 --warmup-ms 0 --repeats 1 --scaling-max-length 65536

      - name: Check the output files
        run: |
          for name in sys_info.txt log.txt for_each_scaling.csv genome_sweep.csv \
              genome_sweep_log.txt human_genome.csv; do
            if [ -z "$(find "${OUTPUT_DIR}" -name "$name" -size +0)" ]; then
              echo "Missing or empty: $name" >&2
              exit 1
            fi
          done
          find "${OUTPUT_DIR}" -type f | sort

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: run-script-${{ matrix.config.os }}
          path: ${{ env.OUTPUT_DIR }}
