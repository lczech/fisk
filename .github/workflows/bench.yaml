name: Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: GCC
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          # Linux: Clang
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          # macOS: AppleClang
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          # Windows: MSVC
          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: Release
      # Directory inside the repo where the binary will write CSVs / plots
      OUTPUT_DIR: artifacts/${{ matrix.os }}-${{ matrix.compiler }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas matplotlib

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # MSVC isn't picked via CC/CXX env vars the way GCC/Clang are, and needs the Visual
      # Studio developer environment (vcvarsall) set up first, so it gets its own setup step
      # instead of using the system-installed compiler the other rows rely on.
      - name: Setup C++ (Windows MSVC)
        if: matrix.compiler == 'msvc'
        uses: aminya/setup-cpp@v1
        with:
          compiler: msvc
          cmake: true
          ninja: true
          vcvarsall: true

      - name: Configure CMake
        run: |
          if [[ "${{ matrix.compiler }}" == "msvc" ]]; then
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          else
            export CC="${{ matrix.cc }}"
            export CXX="${{ matrix.cxx }}"
            cmake -B build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          fi

      - name: Build
        run: |
          cmake --build build --config "${BUILD_TYPE}" -- -j 4

      - name: Run tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run benchmarks
        run: |
          mkdir -p "${OUTPUT_DIR}"
          ./bin/fisk_benchmarks --output-dir "${OUTPUT_DIR}" &> ${OUTPUT_DIR}/log.txt

      - name: Run plotting script
        run: |
          ./plot/plot_all_benchs.sh ${OUTPUT_DIR}

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ env.OUTPUT_DIR }}
