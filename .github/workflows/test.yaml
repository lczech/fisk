name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    strategy:
      fail-fast: false

      # Instead of a matrix cross-product (which would include combinations that don't exist,
      # e.g. old GCC versions on new Ubuntu releases), we list the exact combinations we want.
      #
      # Exact per-(os, compiler-version) availability drifts over time as GitHub retires images
      # and package repositories drop old toolchain versions; this list will need updating then.

      matrix:
        # Dummy entries so the matrix variables exist; every real combination is in `include`.
        os: [ ubuntu-latest ]
        compiler: [ gcc ]

        include:

          # -------------------------------
          #     Ubuntu 22.04
          # -------------------------------

          - { os: ubuntu-22.04, compiler: gcc-10 }
          - { os: ubuntu-22.04, compiler: gcc-11 }
          - { os: ubuntu-22.04, compiler: gcc-12 }
          - { os: ubuntu-22.04, compiler: gcc-13 }
          - { os: ubuntu-22.04, compiler: gcc-14 }
          - { os: ubuntu-22.04, compiler: llvm-13 }
          - { os: ubuntu-22.04, compiler: llvm-14 }
          - { os: ubuntu-22.04, compiler: llvm-15 }
          - { os: ubuntu-22.04, compiler: llvm-16 }
          - { os: ubuntu-22.04, compiler: llvm-17 }
          - { os: ubuntu-22.04, compiler: llvm-18 }
          - { os: ubuntu-22.04, compiler: llvm-19 }
          - { os: ubuntu-22.04, compiler: llvm-20 }

          # -------------------------------
          #     Ubuntu 24.04
          # -------------------------------

          - { os: ubuntu-24.04, compiler: gcc-10 }
          - { os: ubuntu-24.04, compiler: gcc-11 }
          - { os: ubuntu-24.04, compiler: gcc-12 }
          - { os: ubuntu-24.04, compiler: gcc-13 }
          - { os: ubuntu-24.04, compiler: gcc-14 }
          - { os: ubuntu-24.04, compiler: llvm-17 }
          - { os: ubuntu-24.04, compiler: llvm-18 }
          - { os: ubuntu-24.04, compiler: llvm-19 }
          - { os: ubuntu-24.04, compiler: llvm-20 }

          # -------------------------------
          #     Ubuntu 26.04
          # -------------------------------

          - { os: ubuntu-26.04, compiler: gcc-11 }
          - { os: ubuntu-26.04, compiler: gcc-12 }
          - { os: ubuntu-26.04, compiler: gcc-13 }
          - { os: ubuntu-26.04, compiler: gcc-14 }
          - { os: ubuntu-26.04, compiler: gcc-15 }
          - { os: ubuntu-26.04, compiler: llvm-17 }
          - { os: ubuntu-26.04, compiler: llvm-18 }
          - { os: ubuntu-26.04, compiler: llvm-19 }
          - { os: ubuntu-26.04, compiler: llvm-20 }

          # -------------------------------
          #     macOS 15
          # -------------------------------

          # LLVM 14 and 15 use their own libc++ here, which lacks the std::ranges algorithms.
          # Code that is built in these jobs thus uses the classic iterator algorithms instead.
          - { os: macos-15, compiler: llvm-14 }
          - { os: macos-15, compiler: llvm-15 }
          - { os: macos-15, compiler: llvm-16 }
          - { os: macos-15, compiler: llvm-17 }
          - { os: macos-15, compiler: llvm-18 }
          - { os: macos-15, compiler: llvm-19 }
          - { os: macos-15, compiler: llvm-20 }
          - { os: macos-15, compiler: apple-clang }

          # -------------------------------
          #     macOS 26
          # -------------------------------

          - { os: macos-26, compiler: llvm-16 }
          - { os: macos-26, compiler: llvm-17 }
          - { os: macos-26, compiler: llvm-18 }
          - { os: macos-26, compiler: llvm-19 }
          - { os: macos-26, compiler: llvm-20 }
          - { os: macos-26, compiler: apple-clang }

          # -------------------------------
          #     Windows (MSVC)
          # -------------------------------

          - { os: windows-2022, compiler: msvc }
          - { os: windows-latest, compiler: msvc }

          # -------------------------------
          #     Sanitizers
          # -------------------------------

          # AddressSanitizer and UndefinedBehaviorSanitizer, with the newest GCC and Clang, and on
          # macOS for the Neon code paths. See the Configure CMake step for their flags.
          - { os: ubuntu-26.04, compiler: gcc-15, sanitize: true }
          - { os: ubuntu-26.04, compiler: llvm-20, sanitize: true }
          - { os: macos-26, compiler: apple-clang, sanitize: true }

          # -------------------------------
          #     AVX512 Emulation
          # -------------------------------

          # The runners may not have AVX512, so this entry enables the AVX512 code paths via
          # FISK_ENABLE_AVX512, and runs the tests under the Intel Software Development Emulator.
          - { os: ubuntu-26.04, compiler: llvm-20, sde: true }

    runs-on: ${{ matrix.os }}

    env:
      BUILD_TYPE: Release
      SANITIZE_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all
      SDE_URL: https://downloadmirror.intel.com/843185/sde-external-9.48.0-2024-11-25-lin.tar.xz

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup C++
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          vcvarsall: ${{ runner.os == 'Windows' }}

      - name: Setup Intel SDE
        if: matrix.sde
        run: |
          mkdir -p "${RUNNER_TEMP}/sde"
          curl -sSL "${SDE_URL}" | tar -xJ -C "${RUNNER_TEMP}/sde" --strip-components=1
          echo "SDE_PATH=${RUNNER_TEMP}/sde" >> "${GITHUB_ENV}"

      # The sanitizer and emulator entries only build the tests. The sanitizers use a Debug build
      # with -O1, for usable stack traces at a bearable speed, and fail on the first report.
      - name: Configure CMake
        run: |
          if [[ "${{ matrix.sanitize }}" == "true" ]]; then
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DFISK_BUILD_BENCHMARKS=OFF \
              -DCMAKE_CXX_FLAGS="-O1 -fno-omit-frame-pointer ${SANITIZE_FLAGS}" \
              -DCMAKE_EXE_LINKER_FLAGS="${SANITIZE_FLAGS}"
          elif [[ "${{ matrix.sde }}" == "true" ]]; then
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -DFISK_BUILD_BENCHMARKS=OFF \
              -DFISK_ENABLE_AVX512=ON
          else
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          fi

      - name: Build
        id: build
        run: |
          cmake --build build -- -j 4 -k 0 2>&1 | tee build.log

      # GitHub shows at most 10 error annotations per step, so all distinct error lines of the
      # build also go to the job summary.
      - name: Summarize build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E 'error( [A-Z]+[0-9]+)?:' build.log | awk '!seen[$0]++' || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Under the emulator, the test binary runs directly, emulating a Sapphire Rapids CPU. The
      # AVX512 tests only exist if the AVX512 code paths were compiled in, so the run fails if they
      # did not run.
      - name: Run tests
        run: |
          if [[ "${{ matrix.sde }}" == "true" ]]; then
            "${SDE_PATH}/sde64" -spr -- bin/fisk_tests 2>&1 | tee tests.log
            grep -q 'OK \] SimdArch.AVX512$' tests.log
          else
            ctest --test-dir build --output-on-failure
          fi
